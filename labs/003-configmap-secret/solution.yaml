apiVersion: v1
kind: ConfigMap
metadata: {name: app-config}
data: {APP_MODE: production}
---
apiVersion: v1
kind: Secret
metadata: {name: api-secret}
type: Opaque
stringData: {TOKEN: training-only}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: nginx:1.27
          env:
            - name: APP_MODE
              valueFrom:
                configMapKeyRef: {name: app-config, key: APP_MODE}
            - name: TOKEN
              valueFrom:
                secretKeyRef: {name: api-secret, key: TOKEN}
