apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d5-002
  labels:
    app.kubernetes.io/part-of: ckad-labs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: ckad-d5-002
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:1.0.0
        args: ["-listen=:9090", "-text=payments-ok"]
        ports:
        - name: http-app
          containerPort: 9090
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: http-app
          periodSeconds: 3
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: ckad-d5-002
spec:
  type: ClusterIP
  selector:
    app: payments-api
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: Pod
metadata:
  name: checkout-client
  namespace: ckad-d5-002
spec:
  containers:
  - name: client
    image: busybox:1.36
    command: ["sh", "-c", "sleep 86400"]
