apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d5-010
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-api
  namespace: ckad-d5-010
spec:
  replicas: 2
  selector:
    matchLabels: {app: shipping-api}
  template:
    metadata:
      labels: {app: shipping-api}
    spec:
      containers:
        - name: http
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:5678", "-text=shipping-ok"]
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 1
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-public
  namespace: ckad-d5-010
spec:
  type: NodePort
  selector: {app: shipping-api}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080
