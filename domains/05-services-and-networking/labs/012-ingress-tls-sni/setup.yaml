apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d5-012
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: ckad-d5-012
spec:
  replicas: 2
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
    spec:
      containers:
        - name: http
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:5678", "-text=orders-secure-ok"]
          ports: [{name: http, containerPort: 5678}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: ckad-d5-012
spec:
  selector: {app: orders}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders-gateway
  namespace: ckad-d5-012
spec:
  ingressClassName: nginx
  tls:
    - hosts: [secure.ckad.local]
      secretName: legacy-tls
  rules:
    - host: secure.ckad.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orders
                port: {number: 80}
