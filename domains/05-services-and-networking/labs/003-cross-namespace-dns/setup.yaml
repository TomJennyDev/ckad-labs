apiVersion: v1
kind: Namespace
metadata: {name: ckad-d5-003}
---
apiVersion: v1
kind: Namespace
metadata: {name: ckad-d5-003-backend}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog, namespace: ckad-d5-003-backend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog}
    spec:
      containers:
      - name: web
        image: hashicorp/http-echo:1.0.0
        args: ["-listen=:8080", "-text=catalog-ok"]
        ports: [{name: http, containerPort: 8080}]
        readinessProbe:
          tcpSocket: {port: http}
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: catalog, namespace: ckad-d5-003-backend}
spec:
  selector: {app: catalog}
  ports: [{port: 80, targetPort: http}]
---
apiVersion: v1
kind: Pod
metadata: {name: storefront, namespace: ckad-d5-003}
spec:
  containers:
  - name: client
    image: busybox:1.36
    command: ["sh", "-c", "sleep 86400"]
    env: [{name: CATALOG_URL, value: "http://catalog:80/"}]
