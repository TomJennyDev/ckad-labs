apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d5-006
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: ckad-d5-006
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: web
          image: python:3.12-alpine
          command: ["sh", "-c"]
          args: ["mkdir -p /srv && echo 'payments-ok' > /srv/index.html && cd /srv && python -m http.server 8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: ckad-d5-006
spec:
  selector:
    app: payments-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-payments
  namespace: ckad-d5-006
spec:
  type: ExternalName
  externalName: payments-old.ckad-d5-006.svc.cluster.local
---
apiVersion: v1
kind: Pod
metadata:
  name: checkout-client
  namespace: ckad-d5-006
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
