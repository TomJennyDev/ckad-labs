apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d3-006
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: ckad-d3-006
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders-api}
  template:
    metadata:
      labels: {app: orders-api}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100"
            memory: 64Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: ckad-d3-006
spec:
  selector: {app: orders-api}
  ports:
  - port: 80
    targetPort: 80
