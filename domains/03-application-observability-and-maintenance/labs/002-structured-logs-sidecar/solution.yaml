apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-worker
  namespace: ckad-d3-002
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-worker
  template:
    metadata:
      labels:
        app: payment-worker
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /var/log/payment
              i=0
              while true; do
                i=$((i+1))
                echo "{\"level\":\"info\",\"service\":\"payment-worker\",\"event\":\"payment_processed\",\"seq\":$i}" >> /var/log/payment/events.log
                sleep 2
              done
          volumeMounts:
            - name: logs
              mountPath: /var/log/payment
        - name: log-streamer
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while [ ! -f /var/log/payment/events.log ]; do sleep 1; done
              exec tail -n +1 -F /var/log/payment/events.log
          volumeMounts:
            - name: logs
              mountPath: /var/log/payment
      volumes:
        - name: logs
          emptyDir: {}
