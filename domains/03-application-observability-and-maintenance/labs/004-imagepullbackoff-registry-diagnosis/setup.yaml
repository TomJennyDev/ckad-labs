apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d3-004
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: ckad-d3-004
spec:
  replicas: 1
  selector:
    matchLabels: {app: catalog-api}
  template:
    metadata:
      labels: {app: catalog-api}
    spec:
      containers:
        - name: web
          image: nginx:ckad-intentionally-missing-tag-2026
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: ckad-d3-004
spec:
  selector: {app: catalog-api}
  ports:
    - port: 80
      targetPort: 80
