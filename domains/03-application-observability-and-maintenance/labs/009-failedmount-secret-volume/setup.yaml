apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d3-009
  labels:
    app.kubernetes.io/part-of: ckad-labs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receipt-api
  namespace: ckad-d3-009
spec:
  replicas: 1
  selector:
    matchLabels:
      app: receipt-api
  template:
    metadata:
      labels:
        app: receipt-api
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: receipt-credentials
              mountPath: /etc/receipt/credentials
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: receipt-credentials
          secret:
            secretName: receipt-credentials
            optional: false
---
apiVersion: v1
kind: Service
metadata:
  name: receipt-api
  namespace: ckad-d3-009
spec:
  selector:
    app: receipt-api
  ports:
    - port: 80
      targetPort: 80
