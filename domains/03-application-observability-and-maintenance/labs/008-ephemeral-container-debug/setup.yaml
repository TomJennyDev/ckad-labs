apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d3-008
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: ckad-d3-008
spec:
  replicas: 1
  selector:
    matchLabels: {app: ledger-api}
  template:
    metadata:
      labels: {app: ledger-api}
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 2
          periodSeconds: 3
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-api
  namespace: ckad-d3-008
spec:
  selector: {app: ledger-api}
  ports:
  - port: 80
    targetPort: 80
