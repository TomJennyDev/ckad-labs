apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d3-007
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: client-config
  namespace: ckad-d3-007
data:
  BACKEND_HOST: "inventory-wrong"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: ckad-d3-007
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: server
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: ckad-d3-007
spec:
  selector:
    app: inventory
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-client
  namespace: ckad-d3-007
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-client
  template:
    metadata:
      labels:
        app: checkout-client
    spec:
      containers:
        - name: client
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args:
            - 'while true; do wget -q -T 2 -O /dev/null "http://${BACKEND_HOST}/" && echo "request=ok host=${BACKEND_HOST}" || echo "request=failed host=${BACKEND_HOST}"; sleep 3; done'
          env:
            - name: BACKEND_HOST
              valueFrom:
                configMapKeyRef:
                  name: client-config
                  key: BACKEND_HOST
