apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d3-001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: ckad-d3-001
spec:
  replicas: 2
  selector:
    matchLabels: {app: checkout-api}
  template:
    metadata:
      labels: {app: checkout-api}
    spec:
      containers:
      - name: api
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        args: [netexec, --http-port=8080]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /wrong, port: 8080}
          initialDelaySeconds: 1
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: ckad-d3-001
spec:
  selector: {app: checkout-api}
  ports:
  - port: 80
    targetPort: 8080
