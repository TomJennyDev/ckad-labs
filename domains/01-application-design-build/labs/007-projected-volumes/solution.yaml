apiVersion: v1
kind: Pod
metadata:
  name: projected-app
  labels:
    app: projected-app
spec:
  serviceAccountName: workload-reader
  automountServiceAccountToken: false
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          test -s /var/run/app/mode
          test -s /var/run/app/credentials/api-key
          test -s /var/run/app/identity/token
          echo "projected-ready"
          sleep 3600
      resources:
        requests:
          cpu: 25m
          memory: 24Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: runtime-bundle
          mountPath: /var/run/app
          readOnly: true
  volumes:
    - name: runtime-bundle
      projected:
        defaultMode: 0440
        sources:
          - configMap:
              name: runtime-settings
              items:
                - key: mode
                  path: mode
                - key: feature-flag
                  path: feature-flag
          - secret:
              name: runtime-credentials
              items:
                - key: api-key
                  path: credentials/api-key
          - downwardAPI:
              items:
                - path: metadata/pod-name
                  fieldRef:
                    fieldPath: metadata.name
                - path: metadata/namespace
                  fieldRef:
                    fieldPath: metadata.namespace
          - serviceAccountToken:
              path: identity/token
              expirationSeconds: 3600
              audience: ckad-training
