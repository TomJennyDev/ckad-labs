apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-observer
  labels:
    app: node-observer
spec:
  selector:
    matchLabels:
      app: node-observer
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: node-observer
        role: telemetry
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      terminationGracePeriodSeconds: 10
      containers:
        - name: observer
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'while true; do echo "node-observer node=$NODE_NAME pod=$POD_NAME"; sleep 5; done'
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
