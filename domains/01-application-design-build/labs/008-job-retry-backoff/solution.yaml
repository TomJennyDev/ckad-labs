apiVersion: batch/v1
kind: Job
metadata:
  name: invoice-retry
  labels:
    app: invoice-retry
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: invoice-retry
    spec:
      restartPolicy: Never
      containers:
        - name: processor
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo 'INFO starting invoice batch'
              echo 'INFO upstream healthy'
              echo 'invoice-processed'
              exit 0
          resources:
            requests: {cpu: 25m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}

