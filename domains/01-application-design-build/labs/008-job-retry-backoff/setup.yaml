apiVersion: batch/v1
kind: Job
metadata:
  name: invoice-retry
  labels:
    app: invoice-retry
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: invoice-retry
    spec:
      restartPolicy: Never
      containers:
        - name: processor
          image: busybox:1.36
          command: ["sh", "-c", "echo 'ERROR upstream 503: temporary outage' >&2; exit 42"]
          resources:
            requests: {cpu: 25m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}

