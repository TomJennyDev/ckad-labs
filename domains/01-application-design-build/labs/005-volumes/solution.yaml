apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: journal}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: archiver
  labels: {app: archiver}
spec:
  volumes:
    - name: cache
      emptyDir: {}
    - name: data
      persistentVolumeClaim:
        claimName: journal
  containers:
    - name: archiver
      image: busybox:1.36
      command: ["sh", "-c", "test -f /data/state.txt || echo durable-v1 > /data/state.txt; echo temporary-v1 > /cache/cache.txt; sleep 3600"]
      volumeMounts:
        - {name: cache, mountPath: /cache}
        - {name: data, mountPath: /data}
