apiVersion: v1
kind: ConfigMap
metadata:
  name: exam-config
data:
  MODE: exam
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: batch-script
data:
  run.sh: |
    #!/bin/sh
    echo "batch-completed"

