apiVersion: batch/v1
kind: Job
metadata:
  name: invoice-batch
  labels:
    app: invoice-batch
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: invoice-batch
    spec:
      restartPolicy: Never
      initContainers:
        - name: telemetry-agent
          image: busybox:1.36
          restartPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              echo sidecar-started
              touch /tmp/agent-ready
              while true; do sleep 2; done
          startupProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/agent-ready"]
            periodSeconds: 1
            failureThreshold: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: invoice-worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo invoice-processing
              sleep 2
              echo invoice-complete
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
