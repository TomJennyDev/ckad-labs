apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-ledger
  labels:
    app: nightly-ledger
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Allow
  suspend: true
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ledger
              image: busybox:1.36
              command: ["sh", "-c", "echo 'ERROR overlapping reconciliation' >&2; exit 3"]
              resources:
                requests: {cpu: 25m, memory: 16Mi}
                limits: {cpu: 100m, memory: 64Mi}
