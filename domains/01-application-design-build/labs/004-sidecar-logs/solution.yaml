apiVersion: v1
kind: Pod
metadata:
  name: orders
  labels: {app: orders}
spec:
  volumes:
    - name: logs
      emptyDir: {}
  containers:
    - name: producer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo ORDER_CREATED >> /logs/events.log; sleep 2; done"]
      volumeMounts:
        - {name: logs, mountPath: /logs}
    - name: log-agent
      image: busybox:1.36
      command: ["sh", "-c", "until [ -f /logs/events.log ]; do sleep 1; done; tail -n +1 -f /logs/events.log"]
      volumeMounts:
        - {name: logs, mountPath: /logs}
