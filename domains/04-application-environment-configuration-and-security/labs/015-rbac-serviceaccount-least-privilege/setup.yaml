apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d4-015
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-reader
  namespace: ckad-d4-015
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-config
  namespace: ckad-d4-015
data:
  mode: audit
---
apiVersion: v1
kind: Secret
metadata:
  name: confidential
  namespace: ckad-d4-015
type: Opaque
stringData:
  password: fake-for-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: audit-reader
  namespace: ckad-d4-015
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: audit-reader
  namespace: ckad-d4-015
subjects:
- kind: ServiceAccount
  name: audit-reader
  namespace: ckad-d4-015
roleRef:
  kind: Role
  name: audit-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: audit-client
  namespace: ckad-d4-015
  labels:
    app: audit-client
spec:
  serviceAccountName: audit-reader
  restartPolicy: Always
  containers:
  - name: kubectl
    image: bitnami/kubectl:1.33
    command: ["/bin/sh","-c","sleep 86400"]
