apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d4-004
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-script
  namespace: ckad-d4-004
data:
  server.py: |
    import http.server, os
    class Handler(http.server.BaseHTTPRequestHandler):
      def do_GET(self):
        if self.path != "/health":
          self.send_response(404); self.end_headers(); return
        try:
          with open("/tmp/request-count", "a") as f: f.write("1\n")
          self.send_response(200); self.end_headers()
          self.wfile.write(("uid="+str(os.getuid())+"; writable_tmp=true").encode())
        except OSError:
          self.send_response(500); self.end_headers()
      def log_message(self, *args): pass
    http.server.HTTPServer(("0.0.0.0",8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ckad-d4-004
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python","-B","/opt/app/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - {name: script, mountPath: /opt/app, readOnly: true}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 1
            periodSeconds: 3
      volumes:
        - name: script
          configMap: {name: gateway-script}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ckad-d4-004
spec:
  selector: {app: gateway}
  ports:
    - {port: 8080, targetPort: 8080}
