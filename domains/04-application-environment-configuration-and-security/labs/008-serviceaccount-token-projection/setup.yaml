apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d4-008
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: invoice-reader
  namespace: ckad-d4-008
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: invoice-settings
  namespace: ckad-d4-008
data:
  currency: VND
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: invoice-config-reader
  namespace: ckad-d4-008
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["invoice-settings"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: invoice-config-reader
  namespace: ckad-d4-008
subjects:
  - kind: ServiceAccount
    name: invoice-reader
    namespace: ckad-d4-008
roleRef:
  kind: Role
  name: invoice-config-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-code
  namespace: ckad-d4-008
data:
  worker.py: |
    import os, ssl, time, urllib.request, urllib.error
    url = "https://kubernetes.default.svc/api/v1/namespaces/ckad-d4-008/configmaps/invoice-settings"
    token_path = os.getenv("TOKEN_FILE", "/var/run/worker-auth/token")
    ca_path = os.getenv("CA_FILE", "/var/run/worker-ca/ca.crt")
    while True:
        try:
            with open(token_path) as f:
                token = f.read().strip()
            ctx = ssl.create_default_context(cafile=ca_path)
            req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
            with urllib.request.urlopen(req, context=ctx, timeout=5) as r:
                import json
                obj = json.load(r)
                if obj["data"]["currency"] == "VND":
                    print("AUTH_OK", flush=True)
                else:
                    print("DATA_WRONG", flush=True)
        except FileNotFoundError:
            print("AUTH_MISSING", flush=True)
        except urllib.error.HTTPError as e:
            print("HTTP_" + str(e.code), flush=True)
        except Exception as e:
            print("AUTH_ERROR_" + type(e).__name__, flush=True)
        time.sleep(3)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-reader
  namespace: ckad-d4-008
spec:
  replicas: 1
  selector:
    matchLabels: {app: invoice-reader}
  template:
    metadata:
      labels: {app: invoice-reader}
    spec:
      serviceAccountName: invoice-reader
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: python:3.12-alpine
          command: ["python", "-u", "/app/worker.py"]
          env:
            - {name: TOKEN_FILE, value: /var/run/worker-auth/token}
            - {name: CA_FILE, value: /var/run/worker-ca/ca.crt}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
          volumeMounts:
            - {name: worker-code, mountPath: /app, readOnly: true}
      volumes:
        - name: worker-code
          configMap:
            name: worker-code
