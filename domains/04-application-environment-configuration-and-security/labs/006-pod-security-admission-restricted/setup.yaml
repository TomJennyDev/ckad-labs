apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d4-006
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: ckad-d4-006
spec:
  replicas: 2
  selector:
    matchLabels: {app: payments-api}
  template:
    metadata:
      labels: {app: payments-api}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          command: ["/bin/sh", "-c"]
          args: ["while true; do echo ready; sleep 30; done"]
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: ckad-d4-006
spec:
  selector: {app: payments-api}
  ports:
    - port: 80
      targetPort: 8080
