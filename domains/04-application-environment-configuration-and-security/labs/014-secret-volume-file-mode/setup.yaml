apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d4-014
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-credentials
  namespace: ckad-d4-014
type: Opaque
stringData:
  token: lab-demo-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ckad-d4-014
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: gateway
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                if [ -r /var/run/credentials/token ] && [ "$(cat /var/run/credentials/token)" = lab-demo-token ]; then
                  echo AUTH_OK
                else
                  echo AUTH_DENIED
                fi
                sleep 5
              done
          volumeMounts:
            - name: credentials
              mountPath: /var/run/credentials
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: gateway-credentials
            defaultMode: 0400
