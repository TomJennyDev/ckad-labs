apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d4-005
  labels:
    app.kubernetes.io/part-of: ckad-labs
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: ckad-d4-005
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-budget
  namespace: ckad-d4-005
spec:
  hard:
    requests.cpu: 300m
    requests.memory: 192Mi
    limits.cpu: 750m
    limits.memory: 384Mi
    pods: "3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-api
  namespace: ckad-d4-005
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: report-api
  template:
    metadata:
      labels:
        app: report-api
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              cpu: 400m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: report-api
  namespace: ckad-d4-005
spec:
  selector:
    app: report-api
  ports:
    - port: 80
      targetPort: 80
