apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d4-003
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-settings
  namespace: ckad-d4-003
data:
  REGION: ap-southeast-1
---
apiVersion: v1
kind: Secret
metadata:
  name: payroll-credential
  namespace: ckad-d4-003
type: Opaque
stringData:
  api-key: private-demo-only
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auditor
  namespace: ckad-d4-003
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auditor-reader
  namespace: ckad-d4-003
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auditor-binding
  namespace: ckad-d4-003
subjects:
- kind: ServiceAccount
  name: auditor
  namespace: ckad-d4-003
roleRef:
  kind: Role
  name: auditor-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: audit-client
  namespace: ckad-d4-003
  labels:
    app: audit-client
spec:
  serviceAccountName: auditor
  restartPolicy: Always
  containers:
  - name: curl
    image: curlimages/curl:8.11.1
    command: ["sh", "-c", "sleep 36000"]
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi}
