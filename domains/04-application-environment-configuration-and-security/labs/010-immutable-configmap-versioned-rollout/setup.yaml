apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d4-010
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config-v1
  namespace: ckad-d4-010
immutable: true
data:
  CATALOG_VERSION: v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: ckad-d4-010
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: api
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              import os
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path != "/health":
                          self.send_response(404); self.end_headers(); return
                      body = ('version=' + os.getenv('CATALOG_VERSION', 'missing')).encode()
                      self.send_response(200)
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
              HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
          env:
            - name: CATALOG_VERSION
              valueFrom:
                configMapKeyRef:
                  name: catalog-config-v1
                  key: CATALOG_VERSION
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: ckad-d4-010
spec:
  selector:
    app: catalog-api
  ports:
    - port: 8080
      targetPort: 8080
