apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d4-011
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-settings
  namespace: ckad-d4-011
data:
  app.yaml: |
    endpoint: https://billing.internal
    retries: 3
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-credential
  namespace: ckad-d4-011
type: Opaque
stringData:
  token: demo-token-v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-gateway
  namespace: ckad-d4-011
spec:
  replicas: 1
  selector:
    matchLabels: {app: billing-gateway}
  template:
    metadata:
      labels: {app: billing-gateway}
    spec:
      containers:
      - name: gateway
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            if [ -r /etc/gateway/config/app.yaml ] && [ -r /etc/gateway/credentials/token ]; then
              echo "READY config and token readable"
            else
              echo "ERROR missing config or token" >&2
            fi
            sleep 5
          done
        volumeMounts:
        - name: gateway-data
          mountPath: /etc/gateway
          readOnly: true
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "test -r /etc/gateway/config/app.yaml && test -r /etc/gateway/credentials/token"]
          initialDelaySeconds: 2
          periodSeconds: 3
      volumes:
      - name: gateway-data
        projected:
          sources:
          - configMap:
              name: gateway-settings
              items:
              - key: missing.yaml
                path: config/app.yaml
          - secret:
              name: gateway-credential
              items:
              - key: token
                path: credentials/token
