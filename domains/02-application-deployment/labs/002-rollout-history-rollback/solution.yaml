apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app: payments
  annotations:
    kubernetes.io/change-cause: "D2-002: rollback from broken release to stable nginx:1.27"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 45
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
        version: stable
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
