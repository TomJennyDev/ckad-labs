apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels: {app: inventory}
spec:
  replicas: 1
  selector:
    matchLabels: {app: inventory}
  template:
    metadata:
      labels: {app: inventory}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{name: http, containerPort: 80}]
        readinessProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 3
        resources:
          requests: {cpu: 20m, memory: 32Mi}
