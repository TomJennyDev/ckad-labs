apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels: {app: inventory}
spec:
  replicas: 1
  selector:
    matchLabels: {app: inventory}
  template:
    metadata:
      labels: {app: inventory}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{containerPort: 80, name: http}]
        readinessProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 3
        resources:
          requests: {cpu: 20m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
spec:
  selector: {app: inventory}
  ports: [{port: 80, targetPort: http}]
