apiVersion: v1
kind: Service
metadata:
  name: report-shard
  labels:
    app: report-shard
spec:
  clusterIP: None
  selector:
    app: report-shard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: report-shard
spec:
  serviceName: report-shard
  replicas: 3
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: report-shard
  template:
    metadata:
      labels:
        app: report-shard
    spec:
      initContainers:
        - name: prepare-index
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ['test -s /data/index.html || hostname > /data/index.html']
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 100Mi
