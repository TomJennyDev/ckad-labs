apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d2-011
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: ckad-d2-011
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do echo agent-v1 node=$NODE_NAME; sleep 10; done"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
