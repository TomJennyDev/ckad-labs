apiVersion: batch/v1
kind: CronJob
metadata:
  name: billing-reconcile
  namespace: ckad-d2-012
spec:
  schedule: "*/5 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 180
      ttlSecondsAfterFinished: 600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reconcile
              image: busybox:1.36
              command: ["/bin/sh", "-c", "echo reconcile-complete"]
