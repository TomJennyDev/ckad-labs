apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-blue
spec:
  replicas: 2
  selector:
    matchLabels: {app: storefront, track: blue}
  template:
    metadata:
      labels: {app: storefront, track: blue}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{name: http, containerPort: 80}]
        readinessProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 3
        resources:
          requests: {cpu: 20m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-green
spec:
  replicas: 2
  selector:
    matchLabels: {app: storefront, track: green}
  template:
    metadata:
      labels: {app: storefront, track: green}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{name: http, containerPort: 80}]
        readinessProbe:
          httpGet: {path: /, port: http}
          periodSeconds: 3
        resources:
          requests: {cpu: 20m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  selector: {app: storefront, track: blue}
  ports: [{name: http, port: 80, targetPort: http}]
