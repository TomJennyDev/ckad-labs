apiVersion: v1
kind: Namespace
metadata:
  name: ckad-d2-010
  labels:
    app.kubernetes.io/managed-by: ckad-labs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-stable
  namespace: ckad-d2-010
spec:
  replicas: 4
  selector:
    matchLabels: {app: storefront, track: stable}
  template:
    metadata:
      labels: {app: storefront, track: stable}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: ckad-d2-010
spec:
  selector: {app: storefront, track: stable}
  ports: [{name: http, port: 80, targetPort: 80}]
