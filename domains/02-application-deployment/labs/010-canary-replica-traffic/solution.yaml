apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-canary
  namespace: ckad-d2-010
spec:
  replicas: 1
  selector:
    matchLabels: {app: storefront, track: canary}
  template:
    metadata:
      labels: {app: storefront, track: canary}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: ckad-d2-010
spec:
  selector: {app: storefront}
  ports: [{name: http, port: 80, targetPort: 80}]
